
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#85837c">
<title>Cafe Soley | Menu</title>
<style>
:root{
 --coffee:#b18a65;
 --cream:#eee4d4;
 --ink:#40372f;
 --muted:#766b60;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Tahoma,Arial,sans-serif;
 color:var(--cream);
 background:
 radial-gradient(ellipse at 20% 10%,#aaa69d 0%,transparent 45%),
 linear-gradient(145deg,#77756e,#89867f 55%,#716e68);
 min-height:100vh;
}
header{
 margin:24px 18px 30px;
 padding:55px 15px;
 text-align:center;
 border:1px solid #c4a17e;
 border-radius:27px;
 background:linear-gradient(145deg,#625c53,#393630);
 box-shadow:0 10px 30px #37332d55;
}
.logo{
 font-family:Georgia,serif;
 font-size:clamp(42px,12vw,65px);
 line-height:1.2;
 letter-spacing:6px;
 color:#d4b18a;
}
.line{
 width:95px;height:3px;
 background:var(--coffee);
 margin:27px auto;
}
.tagline{
 font-size:14px;
 letter-spacing:4px;
 color:#e0d1bd;
}
.welcome{
 margin-top:28px;
 color:#e8ddcf;
 font-size:18px;
}
main{
 max-width:720px;
 margin:auto;
 padding:0 18px 25px;
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 margin-bottom:18px;
}
h2{color:#f1e5d3;font-size:25px;margin:0}
button,input{font-family:inherit}
.lang{
 background:#d9c5ad;
 color:#44382e;
 border:1px solid #a47d59;
 padding:13px 18px;
 border-radius:12px;
 font-size:15px;
 cursor:pointer;
}
.search{
 width:100%;
 padding:17px;
 border-radius:15px;
 border:1px solid #c0a080;
 background:#ded2c3;
 color:#44382e;
 font-size:16px;
 outline:none;
 margin:12px 0 22px;
}
.search::placeholder{color:#817467}
.tabs{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:5px 0 17px;
 scrollbar-color:#b18a65 transparent;
}
.tab{
 flex-shrink:0;
 padding:14px 20px;
 background:#77736b;
 color:#f0e5d5;
 border:1px solid #b59b80;
 border-radius:13px;
 font-size:15px;
 cursor:pointer;
}
.tab.active{
 background:#b18a65;
 color:#fff9ef;
 border-color:#d2b18d;
}
.section-title{
 font-size:22px;
 color:#f0e1ce;
 margin:34px 0 18px;
}
.item{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 background:linear-gradient(135deg,#e3d8ca,#cfc0ae);
 border:1px solid #b59d84;
 border-radius:21px;
 padding:22px 19px;
 margin-bottom:15px;
 box-shadow:0 5px 12px #39352e30;
 color:var(--ink);
}
.info{min-width:0}
.name{font-size:19px;font-weight:bold;margin-bottom:10px}
.desc{color:var(--muted);font-size:14px;line-height:1.8}
.price{
 color:#886345;
 font-size:14px;
 white-space:nowrap;
 text-align:left;
 font-weight:bold;
}
.empty{
 text-align:center;
 padding:35px 10px;
 color:#f0e5d5;
 display:none;
}
footer{
 text-align:center;
 padding:65px 15px 40px;
 color:#eee0cf;
}
footer .line{margin:0 auto 35px}
footer p{color:#e2d4c2}
@media(max-width:380px){
 .top h2{font-size:21px}
 .item{padding:19px 14px}
 .name{font-size:17px}
 .price{font-size:12px}
}
</style>
</head>
<body>

<header>
 <div class="logo">CAFE<br>SOLEY</div>
 <div class="line"></div>
 <div class="tagline">COFFEE • MOMENTS • LIFE</div>
 <div class="welcome" id="welcome">به کافه سولی خوش آمدید</div>
</header>

<main>
 <div class="top">
  <button class="lang" onclick="toggleLanguage()" id="lang">English</button>
  <h2 id="menuTitle">منوی کافه</h2>
 </div>

 <input class="search" id="search"
 placeholder="جستجوی نوشیدنی..."
 oninput="render()">

 <div class="tabs" id="tabs"></div>
 <div id="menu"></div>
 <div class="empty" id="empty">موردی پیدا نشد</div>
</main>

<footer>
 <div class="line"></div>
 <div>CAFE SOLEY</div>
 <p>🤎 ممنون از انتخاب شما</p>
</footer>

<script>
const data=[
{
 cat:"hot",fa:"نوشیدنی‌های گرم",en:"Hot Drinks",
 items:[
  ["اسپرسو سینگل","Single Espresso","عصاره قهوه با عطر و طعم غلیظ","Rich and aromatic single espresso",140],
  ["اسپرسو دبل","Double Espresso","دو شات اسپرسو با طعمی قوی","Two shots of rich espresso",150],
  ["آمریکانو","Americano","اسپرسو ترکیب‌شده با آب گرم","Espresso with hot water",170],
  ["لاته","Latte","ترکیب اسپرسو و شیر بخارداده‌شده","Espresso and steamed milk",250],
  ["کاپوچینو","Cappuccino","اسپرسو، شیر و فوم مخملی","Espresso, milk and creamy foam",250],
  ["لاته طعم‌دار","Flavored Latte","موکا، فندق، وانیل، کارامل","Mocha, hazelnut, vanilla, caramel",290],
  ["ماکیاتو","Macchiato","کارامل، فندق، وانیل","Caramel, hazelnut, vanilla",290],
  ["ماسالا","Masala","ترکیب شیر و ادویه‌های معطر","Milk with aromatic spices",250],
  ["کرک هل","Cardamom Karak","نوشیدنی کرمی با عطر هل","Creamy drink with cardamom",250],
  ["کرک زعفران","Saffron Karak","نوشیدنی کرمی با عطر زعفران","Creamy drink with saffron",250],
  ["هات چاکلت","Hot Chocolate","نوشیدنی گرم و شکلاتی","Rich hot chocolate",250],
  ["چاکلت ماسالا","Chocolate Masala","ترکیب شکلات و ادویه ماسالا","Chocolate with masala spices",250],
  ["چای","Tea","چای تازه‌دم","Freshly brewed tea",70],
  ["شیر گرم","Warm Milk","شیر گرم و تازه","Warm fresh milk",90],
  ["شیر عسل","Honey Milk","ترکیب شیر و عسل","Milk and honey",null]
 ]
},
{
 cat:"coldcoffee",fa:"نوشیدنی‌های سرد کافئین‌دار",en:"Cold Caffeinated Drinks",
 items:[
  ["آیس آمریکانو","Iced Americano","اسپرسو با آب خنک و یخ","Espresso with cold water and ice",170],
  ["آیس لاته","Iced Latte","اسپرسو و شیر سرد","Espresso and cold milk",260],
  ["آیس چاکلت","Iced Chocolate","نوشیدنی خنک و شکلاتی","Refreshing chocolate drink",260],
  ["آیس ماسالا","Iced Masala","شیر سرد با ادویه ماسالا","Cold milk with masala spices",260],
  ["آفوگاتو","Affogato","بستنی با یک شات اسپرسو","Ice cream with a shot of espresso",280],
  ["آیس ماکیاتو","Iced Macchiato","موکا، فندق، وانیل، کارامل","Mocha, hazelnut, vanilla, caramel",290]
 ]
},
{
 cat:"cold",fa:"نوشیدنی‌های سرد",en:"Cold Drinks",
 items:[
  ["موهیتو","Mojito","نوشیدنی خنک لیمو و نعنا","Refreshing lime and mint drink",270],
  ["بلو هاوایی","Blue Hawaii","نوشیدنی خنک با طعم استوایی","Refreshing tropical drink",350],
  ["اکوا","Aqua","نوشیدنی با سیروپ بلو کوراسائو و هایپ","Blue curacao syrup and energy drink",390],
  ["اوشن","Ocean","نوشیدنی خنک و خاص","Refreshing special drink",350]
 ]
},
{
 cat:"shake",fa:"شیک‌ها",en:"Milkshakes",
 items:[
  ["شیک نوتلا","Nutella Shake","ترکیب بستنی، شیر و نوتلا","Ice cream, milk and Nutella",250],
  ["شیک موز","Banana Shake","موز تازه، شیر و بستنی","Fresh banana, milk and ice cream",250],
  ["شیک شکلات","Chocolate Shake","شیر، بستنی و شکلات","Milk, ice cream and chocolate",250],
  ["شیک وانیل","Vanilla Shake","شیر و بستنی با عطر وانیل","Milk and ice cream with vanilla",250],
  ["شیک موز نوتلا","Banana Nutella Shake","موز، نوتلا، شیر و بستنی","Banana, Nutella, milk and ice cream",450]
 ]
},
{
 cat:"tea",fa:"دمنوش",en:"Herbal Tea",
 items:[
  ["دمنوش آرام","Aram Herbal Tea","دمنوش ترکیبی","Herbal blend",250],
  ["دمنوش ماهرخ","Mahrokh Herbal Tea","دمنوش ترکیبی","Herbal blend",250],
  ["دمنوش ترنج","Toranj Herbal Tea","دمنوش ترکیبی","Herbal blend",200]
 ]
},
{
 cat:"cake",fa:"کیک و دسر",en:"Cakes & Desserts",
 items:[
  ["کیک شکلاتی","Chocolate Cake","کیک شکلاتی","Chocolate cake",250],
  ["کیک دبل","Double Cake","کیک دبل","Double cake",250],
  ["کیک تیرامیسو","Tiramisu Cake","کیک با طعم قهوه","Coffee-flavored cake",250],
  ["کیک نسکافه","Nescafe Cake","کیک با طعم نسکافه","Nescafe-flavored cake",250],
  ["نوتلا قایقی","Nutella Boat","دسر نوتلا","Nutella dessert",200]
 ]
},
{
 cat:"special",fa:"قلیان",en:"Special Drinks",
 items:[
  ["لاو","Love","نوشیدنی طعم‌دار","Flavored drink",350],
  ["موسکو","Moscow","نوشیدنی طعم‌دار","Flavored drink",350],
  ["شیخ مانی","Sheikh Mani","نوشیدنی طعم‌دار","Flavored drink",350],
  ["آدامس دارچین","Cinnamon Gum","نوشیدنی طعم‌دار","Flavored drink",350],
  ["پرتقال نعنا","Orange Mint","نوشیدنی طعم‌دار","Flavored drink",350],
  ["دوسیب آلبالو","Two Apples Sour Cherry","نوشیدنی طعم‌دار","Flavored drink",350]
 ]
}
];

let english=false;
let active="all";

function toggleLanguage(){
 english=!english;
 document.documentElement.lang=english?"en":"fa";
 document.documentElement.dir=english?"ltr":"rtl";
 document.getElementById("lang").textContent=english?"فارسی":"English";
 document.getElementById("welcome").textContent=english?
 "Welcome to Cafe Soley":"به کافه سولی خوش آمدید";
 document.getElementById("menuTitle").textContent=english?
 "Cafe Menu":"منوی کافه";
 document.getElementById("search").placeholder=english?
 "Search menu...":"جستجوی نوشیدنی...";
 document.querySelector("footer p").textContent=english?
 "🤎 Thank you for choosing us":"🤎 ممنون از انتخاب شما";
 render();
}

function renderTabs(){
 const labels=english?
 ["All","Hot Drinks","Cold Caffeinated Drinks","Cold Drinks","Milkshakes","Herbal Tea","Cakes & Desserts","Special"]:
 ["همه","نوشیدنی‌های گرم","سرد کافئین‌دار","نوشیدنی‌های سرد","شیک‌ها","دمنوش","کیک و دسر","قلیان"];
 const keys=["all","hot","coldcoffee","cold","shake","tea","cake","special"];

 document.getElementById("tabs").innerHTML=keys.map((key,i)=>
 `<button class="tab ${active===key?"active":""}"
 onclick="setCategory('${key}')">${labels[i]}</button>`
 ).join("");
}

function setCategory(key){
 active=key;
 render();
}

function render(){
 renderTabs();
 const query=document.getElementById("search").value.trim().toLowerCase();
 let html="";
 let count=0;

 data.forEach(section=>{
  if(active!=="all" && active!==section.cat)return;

  let items=section.items.filter(item=>
   (item[0]+" "+item[1]+" "+item[2]+" "+item[3])
   .toLowerCase().includes(query)
  );

  if(!items.length)return;

  html+=`<h3 class="section-title">${english?section.en:section.fa}</h3>`;

  items.forEach(item=>{
   count++;
   const price=item[4]===null?"":(
    english?
    item[4].toLocaleString("en-US")+" Toman":
    item[4].toLocaleString("fa-IR")+" هزار تومان"
   );

   html+=`
   <div class="item">
    <div class="info">
     <div class="name">${item[english?1:0]}</div>
     <div class="desc">${item[english?3:2]}</div>
    </div>
    <div class="price">${price}</div>
   </div>`;
  });
 });

 document.getElementById("menu").innerHTML=html;
 document.getElementById("empty").style.display=count?"none":"block";
}

render();
</script>
</body>
</html>
